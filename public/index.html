<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="theme-color" content="#040C1A" />
    <meta name="description" content="NavisphereX Marine - Maritime Navigation System for professional navigators and ship officers" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Preconnect to domains we'll need immediately ── -->
    <!-- This tells the browser to open connections to these servers NOW,
         while it's still parsing HTML, instead of waiting until JS runs.
         Saves 200-800ms on slow connections per domain. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />

    <!-- ── Critical inline CSS: paint the dark background and splash
         BEFORE any JS or external CSS loads. This eliminates the blank
         black screen — user sees the NavisphereX splash instantly. ── -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #040C1A;
        color: #E2EBF8;
        font-family: 'Exo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }
      #root { min-height: 100vh; }

      /* ── Instant splash shown BEFORE React loads ── */
      #nx-splash {
        position: fixed;
        inset: 0;
        background: #040C1A;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        z-index: 99999;
        padding: 2rem;
        text-align: center;
      }
      #nx-splash-title {
        font-size: 1.8rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        color: #E2EBF8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #nx-splash-title span { color: #00B4D8; }
      #nx-splash-sub {
        font-size: 0.6rem;
        color: #00B4D8;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #nx-splash-msg {
        font-size: 0.82rem;
        color: #8A9BBF;
        margin-top: 8px;
      }
      #nx-splash-bar-wrap {
        width: 200px;
        height: 4px;
        background: rgba(255,255,255,0.08);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 6px;
      }
      #nx-splash-bar {
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, #00B4D8, #1565C0);
        animation: nx-load 3s ease-in-out forwards;
      }
      @keyframes nx-load {
        0%   { width: 0%; }
        30%  { width: 40%; }
        60%  { width: 65%; }
        85%  { width: 80%; }
        100% { width: 85%; }
      }
      #nx-splash-hint {
        font-size: 0.62rem;
        color: #4A5F80;
        margin-top: 4px;
        font-family: monospace;
        letter-spacing: 0.1em;
      }
    </style>

    <title>NavisphereX Marine</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- ── Native HTML splash — visible IMMEDIATELY, before any JS ──
         React removes this automatically once it mounts by hydrating #root.
         We hide it via JS once React is ready (see script at bottom). ── -->
    <div id="nx-splash">
      <div id="nx-splash-title">NAVISPHERE<span>X</span></div>
      <div id="nx-splash-sub">Marine Systems</div>
      <div id="nx-splash-msg">🙏 Welcome — Loading your maritime platform…</div>
      <div id="nx-splash-bar-wrap">
        <div id="nx-splash-bar"></div>
      </div>
      <div id="nx-splash-hint">navispherex.vercel.app</div>
    </div>

    <div id="root"></div>

    <!-- ── Hide the native splash once React has mounted ──
         This runs after React renders, removing the HTML splash so
         the React app shows through cleanly. ── -->
    <script>
      (function() {
        // Poll until #root has children (React mounted)
        var attempts = 0;
        var interval = setInterval(function() {
          attempts++;
          var root = document.getElementById('root');
          var splash = document.getElementById('nx-splash');
          if (!splash) { clearInterval(interval); return; }
          // React has mounted when root has child elements
          if (root && root.children.length > 0) {
            splash.style.transition = 'opacity 0.4s ease';
            splash.style.opacity = '0';
            setTimeout(function() {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 400);
            clearInterval(interval);
          }
          // Safety: remove after 30s regardless
          if (attempts > 300) {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            clearInterval(interval);
          }
        }, 100);
      })();
    </script>
  </body>
</html>
